a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}

.hero p{max-width:650px;color:#a99eb5;font-size:17px;line-height:1.75;margin:0 0 28px}.heroActions{display:flex;gap:12px;flex-wrap:wrap}
.primary,.secondary{border-radius:12px;padding:14px 19px;cursor:pointer;border:1px solid var(--line);transition:.25s}.primary{background:linear-gradient(135deg,#8b3dff,#bd45d9);box-shadow:0 10px 35px rgba(139,59,255,.24);font-weight:800}.primary:hover{transform:translateY(-2px);box-shadow:0 14px 42px rgba(139,59,255,.4)}.secondary{background:rgba(255,255,255,.04);color:#d8cde1}.secondary:hover{background:rgba(255,255,255,.08)}

.section{padding:72px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.sectionHead h2{font-family:Orbitron;font-size:30px;margin:0 0 8px}.sectionHead p{margin:0;color:var(--muted);font-size:14px}.badge{font-size:11px;color:#cdb4e4;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,rgba(28,14,44,.78),rgba(12,7,20,.78));border:1px solid var(--line);border-radius:18px;padding:22px;position:relative;overflow:hidden;transition:.3s}.card:before{content:"";position:absolute;inset:-50%;background:radial-gradient(circle at 50% 0,rgba(168,85,247,.13),transparent 35%);pointer-events:none}.card:hover{transform:translateY(-5px);border-color:rgba(183,122,255,.35);box-shadow:0 18px 55px rgba(0,0,0,.3),0 0 35px rgba(139,59,255,.08)}

.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rule{padding:16px;border-radius:13px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}.rule b{color:#e5d6f2}.rule span{color:#8f839d;font-size:13px;display:block;margin-top:5px;line-height:1.5}

.calculator{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field label{display:block;color:#9d91a9;font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0d0815;color:#fff;outline:none}.field{margin-bottom:13px}.result{display:grid;place-items:center;border-radius:18px;border:1px solid rgba(180,110,255,.25);background:radial-gradient(circle,rgba(139,59,255,.16),transparent 60%),rgba(255,255,255,.025);min-height:210px}.result strong{font:900 44px Orbitron;color:#d2adff}.result span{color:#94869f;font-size:12px}

.systemGallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.systemCard{padding:0;overflow:hidden;border-radius:20px;border:1px solid var(--line);background:rgba(15,8,25,.78);box-shadow:0 18px 55px rgba(0,0,0,.28);transition:.3s}.systemCard:hover{transform:translateY(-5px);border-color:rgba(183,122,255,.4);box-shadow:0 22px 65px rgba(0,0,0,.36),0 0 35px rgba(139,59,255,.1)}.systemCard img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;transition:.4s}.systemCard:hover img{transform:scale(1.025)}.liveOnly{display:inline-flex;align-items:center;gap:8px;color:var(--good);font:800 11px Orbitron;letter-spacing:1px}.liveOnly .dot{width:6px;height:6px}

.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(3,1,7,.76);backdrop-filter:blur(10px)}.modal.show{display:grid}.modalBox{width:min(720px,100%);max-height:85vh;overflow:auto;border:1px solid rgba(190,130,255,.28);border-radius:22px;background:#10091a;box-shadow:0 30px 100px #000;padding:26px;animation:pop .25s ease}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}.modalTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalTop h2{font-family:Orbitron;margin:0}.close{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:9px;padding:8px 11px;cursor:pointer}
.toast{position:fixed;right:20px;bottom:20px;z-index:120;padding:13px 17px;border:1px solid rgba(103,247,187,.25);background:rgba(7,20,16,.9);color:#aefbd9;border-radius:12px;transform:translateY(100px);opacity:0;transition:.3s}.toast.show{transform:none;opacity:1}

.systemsIntro{display:flex;align-items:center;gap:15px;padding:18px 20px;margin-bottom:18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,rgba(139,59,255,.10),rgba(255,255,255,.025))}.systemsIntro>span{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.2);font-size:20px;color:#d5b5ff}.systemsIntro strong{display:block;font:800 13px Orbitron;letter-spacing:.8px}.systemsIntro small{display:block;color:#9588a2;margin-top:4px;line-height:1.5}.systemLibrary{display:grid;grid-template-columns:repeat(2,1fr);gap:16px};align-items:start.systemRule{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(28,14,44,.82),rgba(12,7,20,.82));overflow:hidden;box-shadow:0 15px 45px rgba(0,0,0,.2)}.systemRule h3{margin:0;padding:19px 21px;border-bottom:1px solid rgba(255,255,255,.06);font:800 16px Orbitron;color:#f6efff}.systemRule h3.accordionTrigger{border:0;width:100%;display:flex;align-items:center;justify-content:space-between;gap:18px;text-align:left;background:transparent;cursor:pointer;transition:.25s}.systemRule h3.accordionTrigger:hover{background:rgba(168,85,247,.07)}.systemRule h3.accordionTrigger:after{content:"+";flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(183,122,255,.22);border-radius:9px;color:#cfa8ff;font:700 20px Inter;transition:.3s}.systemRule.open h3.accordionTrigger{color:#fff;background:rgba(168,85,247,.07)}.systemRule.open h3.accordionTrigger:after{content:"−";transform:rotate(180deg);background:rgba(168,85,247,.12)}.ruleText{white-space:pre-wrap;padding:0 21px;color:#c1b5ca;font-size:13px;line-height:1.65;max-height:0;overflow:hidden;opacity:0;transition:max-height .45s ease,padding .35s ease,opacity .25s ease}.systemRule.open .ruleText{padding:20px 21px;max-height:9000px;overflow:auto;opacity:1}.ruleText::-webkit-scrollbar{width:7px}.ruleText::-webkit-scrollbar-thumb{background:rgba(168,85,247,.28);border-radius:10px}

/* MortaLeague contribution calculator */

.contributionCalc{display:grid;grid-template-columns:1.08fr .92fr;gap:20px}
.calcPanel,.contributionResult{padding:24px;border:1px solid var(--line);border-radius:20px;background:rgba(15,8,25,.72);box-shadow:0 18px 55px rgba(0,0,0,.22)}
.calcNotice{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid rgba(168,85,247,.18);border-radius:14px;background:rgba(168,85,247,.06);margin-bottom:20px}
.calcNotice>span{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(168,85,247,.14);color:#d2adff;font-size:18px}
.calcNotice strong{display:block;font:800 12px Orbitron;letter-spacing:1px}
.calcNotice small{display:block;color:#9d91a9;font-size:12px;margin-top:4px}
.calcNotice small b{color:#d9c3ff}
.calcGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
.calcGrid .field:first-child{grid-column:1/-1}
.calcContributionBtn{width:100%;margin-top:4px}
.contributionResult{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.contributionResult>span{color:#94869f;font:700 11px Orbitron;letter-spacing:1.5px}
.contributionResult>strong{font:900 clamp(32px,5vw,52px) Orbitron;color:#d2adff;margin:10px 0 22px;word-break:break-word}
.contributionBreakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contributionBreakdown>div{padding:13px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.025)}
.contributionBreakdown small{display:block;color:#897c95;font-size:11px}
.contributionBreakdown b{display:block;margin-top:5px;font-size:14px}
@media(max-width:900px){.contributionCalc{grid-template-columns:1fr}.calcGrid{grid-template-columns:1fr}.calcGrid .field:first-child{grid-column:auto}}


/* MortaLeague v1: performance, mobile and system search */
.systemTools{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.systemSearch{flex:1;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025)}
.systemSearch span{font-size:21px;color:#a98ac6}

.systemNoResults{display:none;padding:22px;border:1px dashed var(--line);border-radius:15px;color:#a99bbd;text-align:center;margin-bottom:12px}
.systemRule.isHidden{display:none}
.systemRule.searchHit h3{color:#fff}
@media (max-width:900px){
  .nav{height:68px;padding:0 14px}
  .navlinks{display:none}

.accountCard{position:relative;width:min(440px,calc(100% - 28px));padding:28px;border:1px solid rgba(168,85,247,.24);border-radius:22px;background:#100a18;box-shadow:0 30px 90px rgba(0,0,0,.5);z-index:1}
.accountClose{position:absolute;right:13px;top:10px;border:0;background:transparent;color:#a99bb2;font-size:28px;cursor:pointer}
.accountTabs{display:flex;gap:6px;margin-bottom:24px}
.accountTab{flex:1;border:1px solid var(--line);background:transparent;color:#93869c;padding:11px;border-radius:10px;cursor:pointer;font:700 11px Orbitron}
.accountTab.active{color:#fff;background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.35)}
.accountEyebrow{font:700 10px Orbitron;color:#a855f7;letter-spacing:1.5px}
.accountCard h3{font:800 25px Orbitron;margin:8px 0}
.accountCard p{color:#93879d;font-size:13px;line-height:1.55;margin:0 0 20px}
.accountCard label{display:block;color:#aaa0b4;font-size:11px;font-weight:700;margin:13px 0}
.accountCard input,.accountCard select,.accountCard textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:#0b0710;color:#fff;padding:12px;outline:none}
.accountCard input:focus,.accountCard select:focus,.accountCard textarea:focus{border-color:rgba(168,85,247,.5)}
.accountSubmit{width:100%;border:0;border-radius:11px;padding:13px;background:#a855f7;color:#fff;font:800 11px Orbitron;cursor:pointer;margin-top:8px}
.accountMessage{min-height:20px;margin-top:12px;color:#bda7ce;font-size:12px}
@media(max-width:700px){.accountActions .accountBtn{padding:9px 8px;font-size:9px}.accountCard{padding:23px}}


/* Account buttons belong to the top navigation */
.nav .accountActions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav .accountBtn{white-space:nowrap}
@media(max-width:900px){
  .nav .accountActions{display:flex;margin-left:auto}
  .nav .accountBtn{padding:9px 10px;font-size:9px}
}
@media(max-width:520px){
  .nav .accountActions{gap:5px}
  .nav .accountBtn{padding:8px 7px;font-size:8px}
}

</style>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="particles"></div>

<header>
<nav class="nav">
<a class="logo" href="#home"><span class="logoMark"></span><div>MORTALLEAGUE<small>THE DARK FOOTBALL ERA</small></div></a>
<div class="navlinks">
<button data-scroll="home">Ana Sayfa</button>
<button data-scroll="league">Lig</button>
<button data-scroll="systems">Sistemler</button>
</div>
<div class="accountActions" id="accountActions">
  <button class="accountBtn" id="openLogin">GİRİŞ YAP</button>
  <button class="accountBtn accountPrimary" id="openRegister">KAYIT OL</button>
</div>
<div class="profileModal" id="profileModal" aria-hidden="true">
  <div class="accountBackdrop" data-close-profile></div>
  <div class="accountCard profileCard" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
    <button class="accountClose" data-close-profile aria-label="Kapat">×</button>
    <span class="accountEyebrow">OYUNCU PROFİLİ</span>
    <h3 id="profileTitle">Profilin</h3>
    <div class="profileHero"><div class="profileAvatarLarge"><span id="profileAvatarFallback">W</span><img id="profileAvatar" alt="Profil fotoğrafı" hidden></div><div><b id="profileUsername">wexemir</b><small>Profil bilgilerini buradan düzenleyebilirsin.</small></div></div>
    <label>Profil Fotoğrafı<input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <label>Hakkında<textarea id="profileBio" maxlength="280" rows="4" placeholder="Kendin hakkında kısa bir şey yaz..."></textarea></label>
    <button class="accountSubmit" id="saveProfile">PROFİLİ KAYDET</button>
    <div class="profileActions"><button class="accountBtn accountPrimary" id="contactAdmin">ADMİN'E NOT BIRAK</button><button class="accountBtn" id="logoutButton">ÇIKIŞ YAP</button></div>
    <div class="accountMessage" id="profileStatus"></div>
  </div>
</div>

<div class="contactModal" id="contactModal" aria-hidden="true">
  <div class="accountBackdrop" data-close-contact></div>
  <div class="accountCard contactCard" role="dialog" aria-modal="true">
    <button class="accountClose" data-close-contact aria-label="Kapat">×</button>
    <span class="accountEyebrow">DESTEK</span>
    <h3>Admin ile İletişime Geç</h3>
    <p>Şikayet, öneri, hata veya isteklerini buradan iletebilirsin.</p>
    <label>Konu
      <select id="contactType">
        <option>Öneri</option>
        <option>Şikayet</option>
        <option>Hata Bildirimi</option>
        <option>Diğer</option>
      </select>
    </label>
    <label>Mesaj<textarea id="contactMessage" maxlength="2000" rows="6"></textarea></label>
    <button class="accountSubmit" id="contactSubmit">MESAJI GÖNDER</button>
    <div class="accountMessage" id="contactStatus"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
